name: Demo catalog tests
on:
  pull_request:
    paths:
      - scripts/*demo-catalog.py
      - .github/workflows/*demo-catalog*.yml
  push:
    branches: [main]
    paths:
      - scripts/*demo-catalog.py
      - .github/workflows/*demo-catalog*.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/test-demo-catalog.py
