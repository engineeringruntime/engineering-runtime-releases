name: Demo catalog tests
on:
  pull_request:
    paths:
      - scripts/*demo-catalog.py
      - .github/workflows/*demo-catalog*.yml
  push:
    branches: [main]
    paths:
      - scripts/*demo-catalog.py
      - .github/workflows/*demo-catalog*.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/test-demo-catalog.py
