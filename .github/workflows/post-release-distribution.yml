name: Post-release distribution handoff

# This workflow does not approve or publish a Runtime release.
# It verifies an already-published stable inventory before coordinating
# downstream distribution. The original Runtime qualification gates remain
# in engineering-runtime's release workflow and release operator record.
on:
  release:
    types: [published]
  # Sunday 19:23 UTC (Monday morning Australia/Melbourne), read-only audit.
  schedule:
    - cron: '23 19 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-published stable tag (vX.Y.Z)
        type: string
        required: true
      audit_only:
        description: Check public documentation references without redispatching Homebrew
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - .github/workflows/post-release-distribution.yml
      - scripts/verify-distribution-release.py
      - scripts/test-verify-distribution-release.py
      - scripts/audit-public-version-references.py
      - scripts/test-audit-public-version-references.py

permissions:
  contents: read

concurrency:
  group: post-release-distribution-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  offline-gate:
    name: Verify distributor gate fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline publication inventory tests
        run: python3 scripts/test-verify-distribution-release.py
      - name: Offline public-reference hygiene tests
        run: python3 scripts/test-audit-public-version-references.py

  homebrew-handoff:
    name: Verify public inventory and dispatch Homebrew
    needs: offline-gate
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.audit_only) ||
      (github.event_name == 'release' &&
       !github.event.release.draft &&
       !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify published stable inventory (with upload-race retries)
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_VERSION"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only exact stable vX.Y.Z releases can update distribution"
            exit 1
          fi
          dir="$RUNNER_TEMP/distribution-inventory"
          mkdir -p "$dir"
          for attempt in 1 2 3 4 5 6; do
            rm -f "$dir/release.json" "$dir/latest.json" "$dir/PROVENANCE.json" "$dir/SHA256SUMS.txt"
            if gh api "repos/engineeringruntime/engineering-runtime-releases/releases/tags/$tag" > "$dir/release.json" &&
               gh api "repos/engineeringruntime/engineering-runtime-releases/releases/latest" > "$dir/latest.json" &&
               gh release download "$tag" -R engineeringruntime/engineering-runtime-releases \
                 --pattern PROVENANCE.json --pattern SHA256SUMS.txt --dir "$dir" --clobber &&
               python3 scripts/verify-distribution-release.py \
                 --release "$dir/release.json" --latest "$dir/latest.json" \
                 --provenance "$dir/PROVENANCE.json" --checksums "$dir/SHA256SUMS.txt" \
                 --tag "$tag"; then
              printf 'APPROVED_DISTRIBUTION_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "::error::Published inventory incomplete or inconsistent; no downstream dispatch"
              exit 1
            fi
            sleep 15
          done

      - name: Confirm Latest still matches before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api repos/engineeringruntime/engineering-runtime-releases/releases/latest --jq .tag_name)
          test "$current" = "$APPROVED_DISTRIBUTION_TAG" || {
            echo "::error::Latest release changed; refusing stale downstream dispatch"
            exit 1
          }

      - name: Request exact-version Homebrew update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing HOMEBREW_TAP_DISPATCH_TOKEN: configure a narrowly scoped token with Actions write on homebrew-tap"
            exit 1
          fi
          gh workflow run update.yml \
            -R engineeringruntime/homebrew-tap \
            --ref main \
            -f release_version="$APPROVED_DISTRIBUTION_TAG"
          {
            echo "### Downstream distribution handoff"
            echo "Requested the Homebrew formula updater for **$APPROVED_DISTRIBUTION_TAG**."
            echo "This reports dispatch acceptance, **not** a qualified Homebrew install or passing downstream CI."
            echo "Verify the [Homebrew updater and CI runs](https://github.com/engineeringruntime/homebrew-tap/actions) before release closure."
          } >> "$GITHUB_STEP_SUMMARY"

  public-reference-hygiene:
    name: Audit leftover public release labels (advisory)
    needs: offline-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'release' &&
       !github.event.release.draft &&
       !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch current public source references
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL https://api.github.com/repos/engineeringruntime/engineering-runtime-releases/releases/latest | jq -r .tag_name)
          requested="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            requested="$current"
          fi
          if [[ "$current" != "$requested" ]]; then
            echo "::warning::Reference audit skipped: requested release is not Latest"
            exit 0
          fi
          if ! [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest release tag has unexpected format"
            exit 1
          fi
          dir="$RUNNER_TEMP/public-version-audit"
          mkdir -p "$dir"
          root=https://raw.githubusercontent.com/engineeringruntime
          curl -fsSL --retry 3 "$root/engineering-runtime-docs/main/mkdocs.yaml" -o "$dir/docs-config.yaml"
          curl -fsSL --retry 3 "$root/engineering-runtime-website/main/docs/index.md" -o "$dir/website-home.md"
          curl -fsSL --retry 3 "$root/engineering-runtime-website/main/docs/releases.md" -o "$dir/website-releases.md"
          curl -fsSL --retry 3 "$root/engineering-runtime-website/main/docs/references/faq.md" -o "$dir/website-faq.md"
          curl -fsSL --retry 3 "$root/engineering-runtime-releases/main/README.md" -o "$dir/releases-readme.md"
          curl -fsSL --retry 3 "$root/engineering-runtime-capabilities/main/README.md" -o "$dir/capabilities-readme.md"
          python3 scripts/audit-public-version-references.py \
            --tag "$requested" --docs-config "$dir/docs-config.yaml" \
            --website-home "$dir/website-home.md" \
            --website-releases "$dir/website-releases.md" \
            --website-faq "$dir/website-faq.md" \
            --releases-readme "$dir/releases-readme.md" \
            --capabilities-readme "$dir/capabilities-readme.md"
