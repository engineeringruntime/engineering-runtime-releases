blank_issues_enabled: false
contact_links:
  - name: Problem with a capability, or a capability request
    url: https://github.com/engineeringruntime/engineering-runtime-capabilities/issues/new/choose
    about: Capability files (github/repo-standards-drift, platform/…) have their own repository and issues.
  - name: Question about using Engineering Runtime or a capability
    url: https://github.com/orgs/engineeringruntime/discussions/categories/q-a
    about: Ask in Discussions (Q&A). Someone can mark the answer.
  - name: An idea that is not concrete yet
    url: https://github.com/orgs/engineeringruntime/discussions/categories/ideas
    about: Discuss it in Discussions (Ideas) first; open an issue once it is concrete.
  - name: Security vulnerability
    url: https://engineeringruntime.com/contact/
    about: Do not open a public issue. Report it privately through the contact page.
